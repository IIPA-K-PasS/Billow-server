# 1. MySQL을 위한 내부 주소(Service) 생성
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# 2. MySQL 컨테이너 배포 (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billow-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: "billow"
          volumeMounts:
            - name: mysql-temp-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-temp-storage
          emptyDir: {}
---
# 3. 우리 앱(billow-server) 배포 (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billow-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billow-server
  template:
    metadata:
      labels:
        app: billow-server
    spec:
      containers:
        - name: billow-server-container
          image: handher0/billow-server:1.4
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 80
            periodSeconds: 20
          envFrom:
            - secretRef:
                name: billow-secrets
---
# 4. 우리 앱을 위한 '내부' 주소(Service) 생성
apiVersion: v1
kind: Service
metadata:
  name: billow-server-service
spec:
  # [정리] Ingress가 사용할 것이므로, 외부로 노출되지 않는 'ClusterIP'가 올바른 타입입니다.
  type: ClusterIP
  selector:
    app: billow-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
# 5. Ingress 규칙 생성 (외부 접속의 최종 해결책)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billow-server-ingress
  annotations:
    # [수정!] 경로를 그대로 전달하라는 지시를 유지합니다.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: "dx-m1"
  rules:
    - host: "210-178-1.111.nip.io"
      http:
        paths:
          # [수정!] 경로를 더 구체적으로 잡아내도록 변경합니다.
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: billow-server-service
                port:
                  number: 8080