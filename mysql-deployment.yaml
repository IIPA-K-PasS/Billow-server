# final-deployment.yaml

# 1. MySQL을 위한 내부 주소(Service) 생성
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# 2. MySQL 컨테이너 배포 (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "billow"
          # [핵심 수정] 영구 디스크 대신, Pod 생애주기를 따르는 임시 디스크(emptyDir) 사용
          volumeMounts:
            - name: mysql-temp-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-temp-storage
          emptyDir: {}
---
# 3. 우리 앱(billow-server) 배포 (기존 deployment.yaml과 동일)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billow-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billow-server
  template:
    metadata:
      labels:
        app: billow-server
    spec:
      containers:
        - name: billow-server-container
          image: handher0/billow-server:0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: billow-secrets
                  key: JWT_SECRET_KEY
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: billow-secrets
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billow-secrets
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billow-secrets
                  key: DB_PASSWORD
---
# 4. 우리 앱을 위한 외부 연결 통로(Service) 생성 (기존 service.yaml과 동일)
apiVersion: v1
kind: Service
metadata:
  name: billow-server-service
spec:
  type: NodePort
  selector:
    app: billow-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080